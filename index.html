<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>電子撲滿 | 智能存錢罐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* 主卡片 */
        .piggy-card {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3), 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 撲滿頭部 icon + 餘額 */
        .hero-section {
            background: linear-gradient(135deg, #2b3b4e 0%, #1d2c3a 100%);
            padding: 2rem 2rem 1.8rem 2rem;
            text-align: center;
            color: white;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
            position: relative;
        }

        .pig-icon {
            font-size: 4rem;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.2));
            margin-bottom: 0.5rem;
        }

        .balance-label {
            font-weight: 500;
            letter-spacing: 1px;
            font-size: 1rem;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .balance-amount {
            font-size: 3.3rem;
            font-weight: 800;
            background: rgba(255,255,240,0.15);
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            font-family: monospace;
            letter-spacing: 2px;
        }

        .currency {
            font-size: 1.5rem;
            font-weight: 500;
            margin-right: 4px;
        }

        /* 控制區塊雙欄 (RWD 手機直排) */
        .action-grid {
            padding: 2rem 1.8rem;
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .action-card {
            flex: 1;
            background: #fefefe;
            border-radius: 1.8rem;
            padding: 1.2rem 1rem 1.4rem;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.08);
        }

        .action-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #1e2f3e;
            border-left: 4px solid #ffb347;
            padding-left: 0.6rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #5f6c7a;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            background: #fafcff;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffb347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.2);
        }

        button {
            width: 100%;
            background: #2b3b4e;
            border: none;
            padding: 0.75rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-deposit {
            background: #2c7a4d;
        }
        .btn-deposit:hover {
            background: #1f5e3a;
        }
        .btn-withdraw {
            background: #b23c1c;
        }
        .btn-withdraw:hover {
            background: #8f2f13;
        }
        button:active {
            transform: scale(0.97);
        }

        /* 交易紀錄區塊 */
        .history-section {
            padding: 0 1.8rem 2rem 1.8rem;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .history-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e2f3e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #8c9aa8;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.8rem;
            margin-top: 0;
            width: auto;
            background: #f0f3f8;
            border-radius: 2rem;
        }
        .clear-btn:hover {
            background: #e2e8f0;
            color: #3a4c5e;
        }
        .transaction-list {
            background: #f8fafd;
            border-radius: 1.5rem;
            padding: 0.2rem;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
        }
        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #e9edf2;
            font-size: 0.85rem;
        }
        .tx-item:last-child {
            border-bottom: none;
        }
        .tx-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .type-deposit {
            color: #2c7a4d;
        }
        .type-withdraw {
            color: #b23c1c;
        }
        .tx-date {
            font-family: monospace;
            font-size: 0.7rem;
            color: #5f6c7a;
        }
        .tx-amount {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .empty-history {
            text-align: center;
            padding: 2rem;
            color: #9aaebf;
            font-size: 0.8rem;
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            padding: 0.8rem;
            color: #7e8c9e;
            border-top: 1px solid #eef2f8;
            background: #ffffffd9;
        }

        @media (max-width: 520px) {
            body { padding: 1rem; }
            .balance-amount { font-size: 2.4rem; }
            .action-grid { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="piggy-card">
    <div class="hero-section">
        <div class="pig-icon">🐷💰</div>
        <div class="balance-label">目前結餘總額</div>
        <div class="balance-amount">
            <span class="currency">$</span><span id="totalBalance">0</span>
        </div>
        <div style="font-size: 0.7rem; margin-top: 12px; opacity: 0.7;">電子撲滿 · 智慧儲蓄</div>
    </div>

    <div class="action-grid">
        <!-- 存錢區塊 -->
        <div class="action-card">
            <div class="action-title">
                <span>📥</span> 存錢
            </div>
            <div class="input-group">
                <label>💰 金額 (NTD)</label>
                <input type="number" id="depositAmount" placeholder="例如: 500" min="1" step="1">
            </div>
            <div class="input-group">
                <label>📅 存錢日期</label>
                <input type="date" id="depositDate">
            </div>
            <button class="btn-deposit" id="depositBtn">
                <span>➕</span> 存入撲滿
            </button>
        </div>

        <!-- 取錢區塊 -->
        <div class="action-card">
            <div class="action-title">
                <span>📤</span> 取錢
            </div>
            <div class="input-group">
                <label>💸 金額 (NTD)</label>
                <input type="number" id="withdrawAmount" placeholder="例如: 200" min="1" step="1">
            </div>
            <div class="input-group">
                <label>📅 取錢日期</label>
                <input type="date" id="withdrawDate">
            </div>
            <button class="btn-withdraw" id="withdrawBtn">
                <span>➖</span> 取出扣除
            </button>
        </div>
    </div>

    <!-- 交易歷史記錄 -->
    <div class="history-section">
        <div class="history-header">
            <h3>📋 收支明細</h3>
            <button class="clear-btn" id="clearHistoryBtn">清除紀錄</button>
        </div>
        <div class="transaction-list" id="transactionList">
            <div class="empty-history">還沒有交易，試著存點錢吧 ✨</div>
        </div>
    </div>
    <footer>
        ⚡ 存錢 / 取錢皆需設定對應日期 | 餘額即時更新
    </footer>
</div>

<script>
    // ---------- 資料儲存鍵值 ----------
    const STORAGE_KEY_BALANCE = 'piggy_balance';
    const STORAGE_KEY_TRANSACTIONS = 'piggy_transactions';

    // ---------- 全域狀態 ----------
    let currentBalance = 0;           // 結餘總額 (數字)
    let transactions = [];            // 交易陣列: { type, amount, date, timestamp }

    // DOM 元素
    const balanceSpan = document.getElementById('totalBalance');
    const depositAmountInput = document.getElementById('depositAmount');
    const depositDateInput = document.getElementById('depositDate');
    const withdrawAmountInput = document.getElementById('withdrawAmount');
    const withdrawDateInput = document.getElementById('withdrawDate');
    const depositBtn = document.getElementById('depositBtn');
    const withdrawBtn = document.getElementById('withdrawBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const transactionListDiv = document.getElementById('transactionList');

    // ---------- 輔助函式: 設定預設日期為今天 (YYYY-MM-DD) ----------
    function setDefaultDates() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        if (!depositDateInput.value) depositDateInput.value = todayStr;
        if (!withdrawDateInput.value) withdrawDateInput.value = todayStr;
    }

    // 格式化顯示日期 (YYYY/MM/DD)
    function formatDate(dateStr) {
        if (!dateStr) return '無日期';
        const parts = dateStr.split('-');
        if (parts.length === 3) return `${parts[0]}/${parts[1]}/${parts[2]}`;
        return dateStr;
    }

    // 更新 UI 總額顯示
    function updateBalanceUI() {
        balanceSpan.innerText = currentBalance.toLocaleString();
    }

    // 儲存至 localStorage
    function persistData() {
        localStorage.setItem(STORAGE_KEY_BALANCE, currentBalance.toString());
        localStorage.setItem(STORAGE_KEY_TRANSACTIONS, JSON.stringify(transactions));
    }

    // 重新渲染交易紀錄列表
    function renderTransactions() {
        if (!transactionListDiv) return;
        
        if (transactions.length === 0) {
            transactionListDiv.innerHTML = `<div class="empty-history">📭 尚無任何交易，新增一筆存錢吧～</div>`;
            return;
        }
        
        // 依照日期排序 (最新的在上，也可以timestamp新->舊)
        const sorted = [...transactions].sort((a,b) => b.timestamp - a.timestamp);
        
        const itemsHTML = sorted.map(tx => {
            const isDeposit = tx.type === 'deposit';
            const symbol = isDeposit ? '+ ' : '- ';
            const amountFormatted = Number(tx.amount).toLocaleString();
            const typeText = isDeposit ? '存入' : '取出';
            const typeClass = isDeposit ? 'type-deposit' : 'type-withdraw';
            const dateDisplay = tx.date ? formatDate(tx.date) : '未記錄日期';
            return `
                <div class="tx-item">
                    <div class="tx-type ${typeClass}">
                        <span>${isDeposit ? '🐖⬇️' : '🐖⬆️'}</span>
                        <span>${typeText}</span>
                    </div>
                    <div class="tx-date">📅 ${dateDisplay}</div>
                    <div class="tx-amount ${typeClass}">${symbol} $${amountFormatted}</div>
                </div>
            `;
        }).join('');
        
        transactionListDiv.innerHTML = itemsHTML;
    }

    // 新增交易 (存或取)
    function addTransaction(type, amount, dateStr) {
        if (!dateStr || dateStr.trim() === "") {
            // 如果日期為空，使用今天的日期作為fallback
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateStr = `${yyyy}-${mm}-${dd}`;
        }
        
        const transaction = {
            type: type,          // 'deposit' 或 'withdraw'
            amount: Number(amount),
            date: dateStr,
            timestamp: Date.now()
        };
        transactions.push(transaction);
        // 重新排序渲染
        renderTransactions();
        persistData();
    }

    // 存錢主邏輯
    function handleDeposit() {
        let amountRaw = depositAmountInput.value.trim();
        if (amountRaw === "") {
            alert("請輸入存錢金額 💰");
            return;
        }
        const amount = Number(amountRaw);
        if (isNaN(amount) || amount <= 0) {
            alert("金額必須為正整數 (大於0)");
            return;
        }
        
        let depositDate = depositDateInput.value.trim();
        if (!depositDate) {
            // 如果沒輸入日期，給予提醒但自動填入今天
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            depositDate = `${yyyy}-${mm}-${dd}`;
            depositDateInput.value = depositDate;
        }
        
        // 更新餘額
        currentBalance += amount;
        updateBalanceUI();
        
        // 新增交易記錄
        addTransaction('deposit', amount, depositDate);
        
        // 清除存錢金額欄位，保留日期（方便連續存）
        depositAmountInput.value = "";
        // 但日期可以保留剛剛使用的 (使用者體驗)
        // 同時顯示成功輕提示 (不用alert可改用視覺回饋 但為了訊息清楚)
        showTemporaryMsg(`✅ 成功存入 $${amount.toLocaleString()}`, '#2c7a4d');
    }

    // 取錢主邏輯 (扣除)
    function handleWithdraw() {
        let amountRaw = withdrawAmountInput.value.trim();
        if (amountRaw === "") {
            alert("請輸入取錢金額 💸");
            return;
        }
        const amount = Number(amountRaw);
        if (isNaN(amount) || amount <= 0) {
            alert("金額必須為正整數 (大於0)");
            return;
        }
        
        if (amount > currentBalance) {
            alert(`餘額不足！目前結餘 $${currentBalance.toLocaleString()}，無法取出 $${amount.toLocaleString()}`);
            return;
        }
        
        let withdrawDate = withdrawDateInput.value.trim();
        if (!withdrawDate) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            withdrawDate = `${yyyy}-${mm}-${dd}`;
            withdrawDateInput.value = withdrawDate;
        }
        
        // 扣除餘額
        currentBalance -= amount;
        updateBalanceUI();
        
        // 新增取錢記錄
        addTransaction('withdraw', amount, withdrawDate);
        
        // 清空取錢金額欄位
        withdrawAmountInput.value = "";
        showTemporaryMsg(`🔽 已取出 $${amount.toLocaleString()}`, '#b23c1c');
    }
    
    // 簡易浮動提示(友善非干擾)
    let toastTimeout = null;
    function showTemporaryMsg(message, colorHint) {
        // 建立或複用一個toast元素
        let toast = document.getElementById('dynamicToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'dynamicToast';
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#1e2f3e';
            toast.style.color = 'white';
            toast.style.padding = '10px 20px';
            toast.style.borderRadius = '40px';
            toast.style.fontSize = '0.85rem';
            toast.style.fontWeight = '500';
            toast.style.zIndex = '999';
            toast.style.boxShadow = '0 6px 14px rgba(0,0,0,0.2)';
            toast.style.backdropFilter = 'blur(8px)';
            toast.style.background = '#2b3b4ecc';
            toast.style.pointerEvents = 'none';
            document.body.appendChild(toast);
        }
        toast.style.background = colorHint ? `${colorHint}dd` : '#2b3b4ecc';
        toast.innerText = message;
        toast.style.opacity = '1';
        toast.style.transition = 'opacity 0.2s';
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.style.opacity = '0';
        }, 1800);
    }
    
    // 清除所有交易紀錄 (保留餘額)
    function clearHistory() {
        if (transactions.length === 0) {
            showTemporaryMsg('📭 紀錄已經是空的', '#5f6c7a');
            return;
        }
        const confirmClear = confirm('⚠️ 清除所有交易明細，但會保留目前餘額，確定繼續？');
        if (!confirmClear) return;
        
        transactions = [];   // 清空交易陣列
        renderTransactions();
        persistData();      // 儲存空交易 + 保留餘額
        showTemporaryMsg('🧹 收支紀錄已清除，餘額保持不變', '#4a5b6e');
    }
    
    // ---------- 初始化 / 載入資料 ----------
    function loadFromStorage() {
        const savedBalance = localStorage.getItem(STORAGE_KEY_BALANCE);
        if (savedBalance !== null && !isNaN(parseFloat(savedBalance))) {
            currentBalance = parseFloat(savedBalance);
        } else {
            currentBalance = 0;
        }
        
        const savedTransactions = localStorage.getItem(STORAGE_KEY_TRANSACTIONS);
        if (savedTransactions) {
            try {
                const parsed = JSON.parse(savedTransactions);
                if (Array.isArray(parsed)) {
                    transactions = parsed;
                } else {
                    transactions = [];
                }
            } catch(e) {
                transactions = [];
            }
        } else {
            // 加一筆歡迎示範交易 (自選: 可增加示例但不影響餘額? 但是為了乾淨體驗不加示範)
            // 不過為讓用戶知道怎麼用，可以跳過示範保持空白歷史
            transactions = [];
        }
        
        // 嚴謹檢查: 若餘額因某種原因與歷史總和不符可同步 (為避免手動編輯localStorage導致矛盾, 以餘額為主)
        // 但可選擇重新校驗：計算交易總和與餘額是否一致? 為了可靠，提供一個可選修復? 但現有餘額優先，
        // 若想更穩健可以同步校驗，因用戶也可能清除紀錄/保留餘額，所以餘額為最準確。
        // 但仍可選用: 簡單檢查避免負數
        if (currentBalance < 0) currentBalance = 0;
        updateBalanceUI();
        renderTransactions();
    }

    // 設定輸入框預設日期 + 監聽頁面加載完畢
    function init() {
        loadFromStorage();
        setDefaultDates();
        
        // 綁定按鈕事件
        depositBtn.addEventListener('click', handleDeposit);
        withdrawBtn.addEventListener('click', handleWithdraw);
        clearHistoryBtn.addEventListener('click', clearHistory);
        
        // 如果用戶點擊日期欄位沒選，不會有強迫bug，保持彈性
        // 當餘額變動與儲存一致
        window.addEventListener('beforeunload', () => {
            persistData();
        });
        
        // 額外: 當輸入框失去焦點或手動調整，不再另外改預設; 但為了增加體驗，如果日期空白提示補值
        // 在存錢和取錢的時候已經有補值機制
    }
    
    // 啟動
    init();
</script>
</body>
</html>
